version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-afterimage
    ports:
      - "6379:6379"
    volumes:
      - falkordb-afterimage-data:/data
    environment:
      - AUTH_SECRET=afterimage-secret-change-in-production
      - ENCRYPTION_KEY=afterimage-encryption-key-change-in-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  falkordb-afterimage-data:
    name: falkordb-afterimage-data